# Render blueprint for the Kanso FastAPI backend.
#
# The repository is a npm workspaces monorepo, so both commands cd into
# apps/api. Render runs them from the repo root, and `rootDir` is deliberately
# not used: it would also scope the build context, and the health check path
# below is served from the app package inside apps/api.
#
# Secrets (sync: false) are set in the Render dashboard, never committed.

envVarGroups:
  - name: kanso-api-env
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: IMAGE_GENERATOR_PROVIDER
        value: pollinations
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: HUGGINGFACE_IMAGE_MODEL
        value: black-forest-labs/FLUX.1-schnell
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FLUX_MODEL
        value: black-forest-labs/flux-1.1-pro
      - key: GROQ_API_KEY
        sync: false
      - key: DESIGNS_PER_GENERATION
        value: "5"
      - key: GENERATION_TIMEOUT_SECONDS
        value: "180"

services:
  - type: web
    name: kanso-api
    runtime: python
    plan: free
    region: singapore
    # Closest region to the Pakistani user base; move it if that changes.
    branch: main
    buildCommand: cd apps/api && pip install -r requirements.txt
    startCommand: cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - fromGroup: kanso-api-env

  - type: worker
    name: kanso-generation-worker
    runtime: python
    plan: starter
    region: singapore
    branch: main
    buildCommand: cd apps/api && pip install -r requirements.txt
    startCommand: cd apps/api && python -m app.worker
    autoDeployTrigger: commit
    envVars:
      - fromGroup: kanso-api-env
