<style>
        body {

            color: #1b1c19; /* on-background */

        .display-font {

        }

            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .delay-300 { animation-delay: 300ms; opacity: 0; }

<body class="bg-background dark:bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

<div class="absolute inset-0 z-0 opacity-30 pointer-events-none" style="background: radial-gradient(circle at 50% 30%, #e6e2dc 0%, transparent 60%);"></div>
