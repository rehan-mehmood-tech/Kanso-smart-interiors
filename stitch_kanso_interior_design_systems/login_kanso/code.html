<title>Kanso - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    },
                    "spacing": {
                        "container-max-app": "1280px",
                        "sm": "8px",
                        "md": "16px",

                        "xxl": "96px",
                        "gutter": "24px",

<style type="text/tailwindcss">
        @layer utilities {
            .ambient-shadow {
                box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.04);
            }
        }
    </style>

<body class="bg-background text-on-background min-h-screen antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<main class="flex min-h-screen w-full flex-col lg:flex-row">
<!-- Left Hemisphere: Imagery Canvas -->
<section class="hidden lg:flex lg:w-1/2 relative bg-surface-container-lowest overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-[20s] ease-out hover:scale-105" data-alt="A high-fidelity architectural editorial photograph of a serene, minimalist living room bathed in soft natural light. Japandi influence with light oak wood, bone white walls, and a carefully curated bonsai tree. Wide angle, hyper-realistic, 8k resolution, evoking calm and sophisticated interior design." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAHwEcrenCaE9bfxLh2KlEETzELEd9gMs05OOEIGGW8Wn5j-W_koOG-17BqgsC-PtMKu3qgi_i2enNYzqPsz92DRFMBp8huC_CLfEgfJK_gFMu3mtpqvLXLHgaWZcIBTTOkfz0ymhklMh-W8xbW2y-G1PW3fgbR1fOO0JSMLOa-cF_Ocr6GkCbG9RKOjok3jvjvFqprt6Cb1iU-eNz0CY4kSjsKpQ9scrJqnP98A1OnaD-hh5N1Rr_A')"></div>
<!-- Optional subtle overlay for text contrast if needed in future, currently kept perfectly clean -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/10 to-transparent"></div>
<div class="absolute top-12 left-12">
<!-- Branding embedded in the canvas -->
<span class="font-display-xl text-headline-md tracking-tighter text-on-primary drop-shadow-md">Kanso</span>
</div>
</section>
<!-- Right Hemisphere: Authentication Form -->
<section class="flex-1 flex flex-col justify-center items-center px-margin-mobile py-xl lg:px-xxl lg:py-xxl bg-surface relative">
<!-- Mobile Branding Header (Only visible on small screens) -->
<div class="absolute top-8 left-margin-mobile lg:hidden">
<span class="font-display-xl text-headline-md tracking-tighter text-primary">Kanso</span>
</div>
<div class="w-full max-w-[420px] mx-auto space-y-xl">
<!-- Intent Header -->
<div class="space-y-sm text-center lg:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile lg:font-headline-lg lg:text-headline-lg text-on-surface">
                        Welcome back.
                    </h1>
<p class="font-body-md text-body-md text-secondary">
                        Sign in to continue designing your space.
                    </p>
</div>
<!-- Form Canvas -->
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-md">
<!-- Email Field -->
<div class="relative">
<label class="sr-only" for="email">Email address</label>
<input autocomplete="email" class="w-full appearance-none border-0 border-b border-outline-variant bg-transparent px-0 py-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-on-surface focus:ring-0 transition-colors duration-300" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="relative">
<label class="sr-only" for="password">Password</label>
<input autocomplete="current-password" class="w-full appearance-none border-0 border-b border-outline-variant bg-transparent px-0 py-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-on-surface focus:ring-0 transition-colors duration-300" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded-sm border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface bg-transparent" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-sm text-label-sm text-secondary cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors duration-300" href="#">
                                Forgot password?
                            </a>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full flex justify-center py-md px-lg border border-transparent rounded-lg shadow-sm font-label-sm text-label-sm text-on-primary bg-primary hover:bg-inverse-surface focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300" type="submit">
                            Sign In
                        </button>
<div class="text-center">
<span class="font-body-md text-body-md text-secondary">Don't have an account? </span>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors duration-300 relative after:content-[''] after:absolute after:w-full after:scale-x-0 after:h-[1px] after:bottom-0 after:left-0 after:bg-primary after:origin-bottom-right after:transition-transform after:duration-300 hover:after:scale-x-100 hover:after:origin-bottom-left" href="#">
                                Create an account
                            </a>
</div>
</div>
</form>
</div>
</section>
</main>
</body></html>
