<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Noto+Serif:wght@400&amp;display=swap" rel="stylesheet"/>

<style>
        .crossfade-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        .image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 10s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #img-finished {
            opacity: 0;
        }
        .progress-bar {
            width: 0%;
            transition: width 12s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .status-text {
            animation: fadeInOut 4s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body class="h-full bg-surface text-on-surface antialiased overflow-hidden">
<div class="crossfade-container">
<!-- Empty Room -->
<div class="image-layer" id="img-empty" style="background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLv_mWExvxNScjJJ-Ja6pXEcJz0bgcB2C2V9nlqX8YEr63g7ZzE8RZ5229FXtqv8FVBISUazDKmj6igJsfsBNe0B5xsqV6cll5TsXAn7i-1ctDG5hyLTex2q1AzqhAIA6EQ_XSoSe4HXym5RZK8gsjIPSSA0yKeKkY-qbrIgW2xQLlX3dR7hCg3n-0snQthxKx56hp7HeFoTIZf7PV1ev6IjGazwGzdNBQ9TNq3u-bPSvb9dhrR5pJ9HuxA');"></div>
<!-- Designed Room -->

<!-- Overlay -->
<div class="absolute inset-0 bg-surface/80 backdrop-blur-md flex flex-col justify-center items-center px-lg text-center">
<h1 class="font-display-xl text-display-xl text-primary mb-xl">Kanso</h1>
<h2 class="font-headline-lg text-headline-lg text-primary mb-md">Architecting your vision...</h2>
<p class="font-body-md text-body-md text-secondary status-text h-6 mb-xl" id="status-indicator">
                Analyzing spatial geometry
            </p>
<div class="w-full max-w-md h-[1px] bg-outline-variant rounded-full overflow-hidden">
<div class="progress-bar h-full bg-primary rounded-full" id="progress"></div>
</div>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const finishedImg = document.getElementById('img-finished');
            const emptyImg = document.getElementById('img-empty');
            const progress = document.getElementById('progress');
            const statusText = document.getElementById('status-indicator');
            
            const statuses = [
                'Analyzing spatial geometry',
                'Curating materials',
                'Finalizing lighting',
                'Applying finishes'
            ];
            
            let statusIndex = 0;

            // Start crossfade after a short delay
            setTimeout(() => {
                finishedImg.style.opacity = '0.7';
                emptyImg.style.opacity = '0.3';
                progress.style.width = '100%';
            }, 500);

            // Cycle status text
            setInterval(() => {
                statusIndex = (statusIndex + 1) % statuses.length;
                statusText.textContent = statuses[statusIndex];
            }, 4000);
        });
    </script>
</body></html>
