<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col selection:bg-surface-variant selection:text-on-background">
<!-- Minimal Header for Wizard Flow -->

<div class="text-headline-md font-headline-md font-bold tracking-tight text-primary">Kanso</div>

<!-- Main Content Area -->
<main class="flex-grow w-full max-w-container-max-app mx-auto px-gutter py-xl md:py-xxl flex flex-col items-center">
<!-- Typography Header -->
<div class="text-center max-w-2xl mx-auto mb-xl">

<p class="text-body-lg font-body-lg text-secondary">We'll use four views of your room to create a more complete visual concept.</p>
</div>
<!-- 2x2 Grid for Photos -->

<!-- Upload Slot 1 -->

<div class="absolute inset-0 bg-surface-variant opacity-0 group-hover:opacity-10 transition-opacity duration-300 z-0"></div>
<div class="relative z-10 flex flex-col items-center transition-transform duration-300 group-hover:-translate-y-1">
<span class="material-symbols-outlined text-outline text-4xl mb-md" data-icon="view_in_ar">view_in_ar</span>
<span class="text-label-sm font-label-sm text-secondary uppercase mb-xs">Wall 1 of 4</span>
<span class="text-body-md font-body-md text-primary font-medium">Upload Photo</span>
</div>
</button>
<!-- Upload Slot 2 -->
<button class="upload-slot group relative bg-surface-container-lowest border border-outline-variant rounded-xl aspect-[4/3] flex flex-col items-center justify-center p-lg overflow-hidden transition-all duration-300 hover:border-outline focus:outline-none focus:ring-2 focus:ring-outline" data-slot="2">
<div class="absolute inset-0 bg-surface-variant opacity-0 group-hover:opacity-10 transition-opacity duration-300 z-0"></div>
<div class="relative z-10 flex flex-col items-center transition-transform duration-300 group-hover:-translate-y-1">
<span class="material-symbols-outlined text-outline text-4xl mb-md" data-icon="view_in_ar" style="transform: rotate(90deg);">view_in_ar</span>

</button>

<div class="relative z-10 flex flex-col items-center transition-transform duration-300 group-hover:-translate-y-1">

                Continue
            </button>

<!-- JavaScript for Interactive Prototyping (Simulates Upload) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const slots = document.querySelectorAll('.upload-slot');
            const continueBtn = document.getElementById('continue-btn');
            let uploadedCount = 0;

            slots.forEach(slot => {
                slot.addEventListener('click', function() {
                    // Simulate checking if already uploaded
                    if (!this.classList.contains('uploaded')) {
                        // Mark as uploaded visually
                        this.classList.add('uploaded');
                        
                        // Update inner HTML to reflect uploaded state (subtle checkmark, remove text)
                        const content = this.querySelector('.z-10');
                        content.innerHTML = `
                            <span class="material-symbols-outlined text-secondary text-4xl mb-sm" data-icon="check_circle">check_circle</span>
                            <span class="text-label-sm font-label-sm text-secondary uppercase">Captured</span>
                        `;
                        
                        // Change border color to indicate success subtly
                        this.classList.remove('border-outline-variant');
                        this.classList.add('border-secondary/50', 'bg-surface');

                        uploadedCount++;
                        checkCompletion();
                    }
                });
            });

            function checkCompletion() {
                if (uploadedCount === 4) {
                    continueBtn.disabled = false;
                    continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant');
                    continueBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary/90');
                }
            }
        });
    </script>
