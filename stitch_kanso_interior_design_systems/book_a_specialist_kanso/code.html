<p class="font-label-sm text-label-sm text-secondary uppercase tracking-widest">Book a Specialist</p>
<h1 class="font-display-xl text-[48px] md:text-display-xl leading-tight">Begin Your Physical Transformation</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md pt-sm">Connect with a local Kanso-certified specialist to bring your vision to life.</p>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-ambient border border-surface-highest p-lg md:p-xl mt-lg relative overflow-hidden">
<form class="space-y-lg relative z-10">
<div class="space-y-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="fullName">Full Name</label>
<input class="w-full text-body-md font-body-md placeholder-secondary-fixed-dim focus:ring-0" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="email">Email Address</label>
<input class="w-full text-body-md font-body-md placeholder-secondary-fixed-dim focus:ring-0" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="location">Project Location</label>
<input class="w-full text-body-md font-body-md placeholder-secondary-fixed-dim focus:ring-0" id="location" name="location" placeholder="City, State, or Zip" required="" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="budget">Budget Range</label>
<select class="w-full text-body-md font-body-md text-on-surface bg-transparent focus:ring-0" id="budget" name="budget">
<option disabled="" selected="" value="">Select Budget</option>
<option value="10k-50k">$10k - $50k</option>
<option value="50k-150k">$50k - $150k</option>
<option value="150k+">$150k+</option>
</select>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-xs" for="timeline">Timeline</label>
<select class="w-full text-body-md font-body-md text-on-surface bg-transparent focus:ring-0" id="timeline" name="timeline">
<option disabled="" selected="" value="">Select Timeline</option>
<option value="asap">Immediate</option>
<option value="3months">1-3 Months</option>
<option value="6months+">6+ Months</option>
</select>
</div>
</div>
</div>

<span class="material-symbols-outlined transform group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
