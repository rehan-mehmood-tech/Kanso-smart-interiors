<style>
        .pulse-ring {
            animation: pulse-ring 2.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { transform: scale(2.5); opacity: 0; }
        }
        .pulse-dot {
            animation: pulse-dot 2.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.8); }
            50% { transform: scale(1); }
            100% { transform: scale(0.8); }
        }
        
        /* Ambient shadow utility from style guide */
        .shadow-ambient {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Blurred Background Image Container -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-30" data-alt="A highly blurred, out-of-focus interior shot of a high-end, minimalist living room with abundant natural light. Soft tones of bone white, taupe, and light stone create a calm, warm minimalist aesthetic. The light filters through sheer curtains, creating a serene, almost dreamlike backdrop perfect for an architectural editorial UI. The overall feel is premium, tranquil, and spacious." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCjHqtpQLmgjh9MGOTDIXJ9malBbvvJiJfVZSkwNMq5sqjuyk6x4I0GxJ0Og8o8_r8QnGx67unZPVwwxxFEd7aGVRa0bb9TGXQxxxACLZf4L84ZH0qP7HlHpVTAgrRjBdfcMkJ_5e6EHNcWTZO2vaCz_jXjdQUehQ_lY259F2UhgFABGZV1hHas0w-G8W_s0_PNy9PxzcLEg0pdkvx7rdUQ3qwDkRplbqSsiBfcx1Y1kbPrugXe5udU')"></div>
<!-- Gradient Overlay to ensure text readability -->
<div class="absolute inset-0 bg-gradient-to-b from-background/40 via-background/60 to-background"></div>
</div>
<!-- Main Content Canvas (Transactional - Navigation Suppressed) -->
<main class="flex-grow flex flex-col items-center justify-center relative z-10 px-gutter md:px-0 max-w-container-max-app mx-auto w-full pt-xxl pb-xxl">
<!-- Pulse Animation Section -->
<div class="relative flex items-center justify-center mb-xl w-48 h-48">
<div class="absolute inset-0 border border-primary/20 rounded-full pulse-ring"></div>
<div class="absolute inset-4 border border-primary/40 rounded-full pulse-ring" style="animation-delay: 0.8s;"></div>
<div class="w-16 h-16 bg-primary rounded-full pulse-dot flex items-center justify-center shadow-ambient">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    search
                </span>
</div>
</div>
<!-- Typography Context -->
<div class="text-center mb-xl max-w-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-md tracking-tight">
                Finding your local specialist...
            </h1>
<p class="font-body-lg text-body-lg text-secondary">
                We are searching our network of curated interior designers and architects to find the perfect match for your vision.
            </p>
</div>
<!-- Matching Criteria Card (Glassmorphism/Minimalist) -->
<div class="bg-surface-container-lowest/80 backdrop-blur-md rounded-xl p-xl shadow-ambient border border-outline-variant/50 w-full max-w-2xl">
<h2 class="font-label-sm text-label-sm text-secondary uppercase tracking-widest mb-lg text-center">
                Matching based on
            </h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-lg">
<!-- Criteria 1 -->
<div class="flex flex-col items-center p-md bg-surface-container-low rounded-lg border border-surface-container">
<span class="material-symbols-outlined text-secondary mb-sm text-2xl">
                        chair
                    </span>
<span class="font-label-sm text-label-sm text-secondary mb-xs">Your Style</span>
<span class="font-body-md text-body-md font-medium text-primary text-center">Japandi</span>
</div>
<!-- Criteria 2 -->
<div class="flex flex-col items-center p-md bg-surface-container-low rounded-lg border border-surface-container">
<span class="material-symbols-outlined text-secondary mb-sm text-2xl">
                        location_on
                    </span>
<span class="font-label-sm text-label-sm text-secondary mb-xs">Your Location</span>
<span class="font-body-md text-body-md font-medium text-primary text-center">San Francisco</span>
</div>
<!-- Criteria 3 -->
<div class="flex flex-col items-center p-md bg-surface-container-low rounded-lg border border-surface-container">
<span class="material-symbols-outlined text-secondary mb-sm text-2xl">
                        architecture
                    </span>
<span class="font-label-sm text-label-sm text-secondary mb-xs">Your Scope</span>
<span class="font-body-md text-body-md font-medium text-primary text-center">Full Living Room Remodel</span>
</div>
</div>
<!-- Progress indication bar -->
<div class="mt-xl h-1 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-1/3 animate-[progress_2s_ease-in-out_infinite_alternate]"></div>
</div>
</div>
<!-- Cancel Action (Subtle) -->
<div class="mt-xl">
<button class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors duration-300 uppercase tracking-widest bg-transparent border-none cursor-pointer">
                Cancel Search
            </button>
</div>
</main>
<style>
        @keyframes progress {
            0% { width: 10%; transform: translateX(0); }
            100% { width: 30%; transform: translateX(230%); }
        }
    </style>
